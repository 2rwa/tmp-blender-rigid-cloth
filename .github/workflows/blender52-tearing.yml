name: Blender 5.2 tearing experiment

on:
  push:
    branches: [main]
    paths:
      - 'experiments52/**'
      - '.github/workflows/blender52-tearing.yml'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment folder name under experiments52/
        required: true
        default: cloth-tearing-minimal-gn52
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tmp-blender-rigid-cloth-52-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment || 'cloth-tearing-minimal-gn52' }}
      BLENDER_VERSION: "5.2.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cheap Python preflight
        run: |
          python3 -m py_compile             "experiments52/$EXPERIMENT/scene.py"             "experiments52/$EXPERIMENT/validate.py"

      - name: Compute render cache key
        id: render-key
        run: |
          content_hash="$(
            find "experiments52/$EXPERIMENT" -type f               ! -name 'validate.py'               ! -name 'README.md'               ! -name 'experiment.json'               ! -name '*.pyc'               ! -path '*/__pycache__/*'               -print0             | sort -z             | xargs -0 sha256sum             | sha256sum             | cut -d' ' -f1
          )"
          echo "key=blender52-tear-${RUNNER_OS}-${BLENDER_VERSION}-${EXPERIMENT}-${content_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore render checkpoint
        id: render-cache
        uses: actions/cache/restore@v6
        with:
          path: output52
          key: ${{ steps.render-key.outputs.key }}

      - name: Restore Blender 5.2 runtime cache
        id: blender-runtime-cache
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build Blender 5.2 runtime cache
        if: steps.render-cache.outputs.cache-hit != 'true' && steps.blender-runtime-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf .cache/blender52-runtime
          mkdir -p             .cache/blender52-runtime/blender             .cache/blender52-runtime/python             .cache/blender52-runtime/egl             .cache/blender52-runtime/apt

          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base_url="https://download.blender.org/release/Blender5.2"

          aria2c -x 8 -s 8 -d /tmp -o "$archive" "$base_url/$archive"
          curl -fsSL "$base_url/blender-${BLENDER_VERSION}.sha256" -o /tmp/blender52.sha256
          (
            cd /tmp
            grep "  $archive$" blender52.sha256 | sha256sum -c -
          )

          tar -xf "/tmp/$archive"             -C .cache/blender52-runtime/blender             --strip-components=1

          python3 -m pip install             --disable-pip-version-check             --no-compile             --target .cache/blender52-runtime/python             "Pillow==10.2.0"

          sudo apt-get update
          (
            cd .cache/blender52-runtime/apt
            apt-get download libegl1
          )
          dpkg-deb -x .cache/blender52-runtime/apt/libegl1_*.deb .cache/blender52-runtime/egl

      - name: Configure Blender 5.2 runtime
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          echo "$GITHUB_WORKSPACE/.cache/blender52-runtime/blender" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/python" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.cache/blender52-runtime/egl/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Verify Blender 5.2 headless runtime
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          blender --version
          command -v xvfb-run
          if ldd "$(command -v blender)" | grep -F "not found"; then
            echo "Missing Blender shared library dependency."
            exit 1
          fi
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy             xvfb-run -a -s "-screen 0 1280x720x24"             blender --background --python-expr "import bpy; print('BLENDER52_XVFB_OK', bpy.app.version_string)"

      - name: Save Blender 5.2 runtime cache
        if: steps.render-cache.outputs.cache-hit != 'true' && steps.blender-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/blender52-runtime
          key: blender-runtime-${{ runner.os }}-x64-${{ env.BLENDER_VERSION }}-v1

      - name: Build tearing scene and render frame sequence
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          rm -rf output52
          mkdir -p output52/frames
          blender --version | tee output52/blender-version.txt
          LIBGL_ALWAYS_SOFTWARE=1 SDL_AUDIODRIVER=dummy             xvfb-run -a -s "-screen 0 1280x720x24"             blender --background               --python "experiments52/$EXPERIMENT/scene.py"               2>&1 | tee output52/blender-scene.log
          if grep -Fq "Traceback (most recent call last):" output52/blender-scene.log; then
            echo "Blender Python traceback detected."
            exit 1
          fi

      - name: Install ffmpeg and build MP4
        if: steps.render-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -framerate 24 -start_number 1             -i output52/frames/frame_%04d.png             -c:v libx264 -preset veryfast -crf 29 -pix_fmt yuv420p             "output52/$EXPERIMENT.mp4"

      - name: Save render checkpoint
        if: steps.render-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: output52
          key: ${{ steps.render-key.outputs.key }}

      - name: Ensure validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Validate tearing experiment
        run: |
          python3 "experiments52/$EXPERIMENT/validate.py"
          cat output52/validation.json

      - name: Upload full tearing artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender52-${{ env.EXPERIMENT }}
          path: output52/
          if-no-files-found: error
          retention-days: 7
          overwrite: true


  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPERIMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.experiment || 'cloth-tearing-minimal-gn52' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download validated tearing artifact
        uses: actions/download-artifact@v4
        with:
          name: blender52-${{ env.EXPERIMENT }}
          path: output52

      - name: Install publish dependency
        run: python3 -m pip install --disable-pip-version-check --no-compile "Pillow==10.2.0"

      - name: Generate persistent result
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          from PIL import Image

          exp = os.environ["EXPERIMENT"]
          src = Path("output52")
          dst = Path("results") / exp
          manifest = json.loads(
              (Path("experiments52") / exp / "experiment.json").read_text(encoding="utf-8")
          )

          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir(parents=True)

          with Image.open(src / "preview.png") as im:
              im.convert("RGB").save(dst / "preview.jpg", quality=88, optimize=True)

          shutil.copy2(src / "validation.json", dst / "validation.json")
          shutil.copy2(src / f"{exp}.mp4", dst / "media.mp4")
          shutil.copy2(src / f"{exp}.blend", dst / f"{exp}.blend")
          report = src / f"{exp}-report.json"
          if report.is_file():
              shutil.copy2(report, dst / report.name)

          title = manifest.get("title", exp)
          desc = manifest.get("description", "")
          validation = json.loads((src / "validation.json").read_text(encoding="utf-8"))
          readme = "\n".join([
              f"# {title}",
              "",
              desc,
              "",
              f"- source commit: \`{os.environ['SOURCE_COMMIT']}\`",
              f"- Actions run: \`{os.environ['RUN_NUMBER']}\` (\`{os.environ['RUN_ID']}\`)",
              "- Blender line: **5.2 experimental Cloth Dynamics / Tearing**",
              "",
              "![Latest preview](./preview.jpg)",
              "",
              "## Validation",
              "",
              "\`\`\`json",
              json.dumps(validation, indent=2),
              "\`\`\`",
              "",
              "## License / ライセンス",
              "",
              "Unless otherwise noted, generated assets in this result are CC0-1.0.",
              "Source code and workflow files used to generate them are MIT-0.",
              "",
          ])
          (dst / "README.md").write_text(readme, encoding="utf-8")
          PY

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git add "results/$EXPERIMENT/"
          if git diff --cached --quiet; then
            echo "Result is already current."
            exit 0
          fi
          git commit -m "chore: publish $EXPERIMENT result"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Build Pages gallery
        run: |
          python3 -m py_compile tools/build_pages.py
          python3 tools/build_pages.py

      - name: Commit and push Pages gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll docs/
          if git diff --cached --quiet; then
            echo "Pages gallery is already current."
            exit 0
          fi
          git commit -m "chore: publish Pages gallery [skip ci]"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          python3 tools/build_pages.py
          git add index.html .nojekyll docs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish Pages gallery [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy_pages:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest Pages content
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
