name: Pages gallery

on:
  push:
    branches: [main]
    paths:
      - 'tools/build_pages.py'
      - '.github/workflows/pages-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tmp-blender-rigid-cloth-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cheap Python preflight
        run: python3 -m py_compile tools/build_pages.py

      - name: Build Pages gallery
        run: python3 tools/build_pages.py

      - name: Commit generated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll docs/
          if git diff --cached --quiet; then
            echo "Gallery is already current."
            exit 0
          fi
          git commit -m "chore: rebuild Pages gallery [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest Pages content
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
