name: Blender experiment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'experiments52/**'
      - 'docs/**'
      - 'tools/build_pages.py'
      - '.github/workflows/pages-gallery.yml'
      - '.github/workflows/blender52-tearing.yml'
      - '.github/workflows/blender52-impact-batch.yml'
      - 'index.html'
      - '.nojekyll'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment folder name under experiments/
        required: true
        default: cloth-hammock-rigidbody-drop-eevee
        type: string

permissions:
  contents: write

concurrency:
  group: tmp-blender-rigid-cloth-${{ github.ref }}
  cancel-in-progress: false
